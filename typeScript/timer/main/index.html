<!DOCTYPE html>
<html>

<head>
    <title>Timer</title>
</head>

<body>



    <h1 id="timer-display">00:00:00</h1>

    <div>
        <label>Hours: <input type="number" id="hours" min="0" value="0"></label>
        <label>Minutes: <input type="number" id="mints" min="0" max="59" value="0"></label>
        <label>Seconds: <input type="number" id="secs" min="0" max="59" value="0"></label>
    </div>

    <button id="start-btn">Start</button>
    <button id="stop-btn">Stop</button>

    <script type="module" src="./index.ts"></script>
</body>

</html>
